[project]
name = "maf-job-card-sample"
version = "1.0.0"
description = "Deterministic job-card workflow using Microsoft Agent Framework Functional API and AG-UI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
